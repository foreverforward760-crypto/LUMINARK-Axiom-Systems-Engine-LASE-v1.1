name: LASE Core Tests

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core with test dependencies
        run: python -m pip install -e "core[tests]"
      - name: Run LASE core tests
        run: python -m pytest -q core/tests
