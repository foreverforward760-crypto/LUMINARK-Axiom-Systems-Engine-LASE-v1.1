[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luminark"
dynamic = ["version"]
description = "LUMINARK Hybrid Engine – SAP-based infrastructure, therapeutic, and AI-safety analysis"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Richard Stanfield", email = "LuminarkMeridian@gmail.com" },
]
keywords = [
    "SAP", "Stanfield Axiom of Perpetuity", "MAAT",
    "infrastructure intelligence", "AI safety",
    "Lyapunov", "unified field", "consciousness"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2.0"]
tests = ["pytest>=7.4", "hypothesis>=6.80"]
benchmark = []          # no extra deps; uses stdlib tracemalloc
yaml = ["pyyaml>=6.0"]
all = [
    "fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2.0",
    "pytest>=7.4", "hypothesis>=6.80",
    "pyyaml>=6.0",
]

[project.scripts]
luminark-benchmark = "benchmark:main"

[project.urls]
Homepage = "https://github.com/foreverforward760-crypto/LuminarkHybridEngine"
Repository = "https://github.com/foreverforward760-crypto/LuminarkHybridEngine"

[tool.setuptools.dynamic]
version = { attr = "luminark.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["luminark*"]

[tool.pytest.ini_options]
testpaths = ["tests", "build4_unified_field"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length handled by formatter
